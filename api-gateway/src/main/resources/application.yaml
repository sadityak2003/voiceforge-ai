server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: user-routes
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/user/**

        - id: admin-routes
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/admin/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: voice-service
          uri: lb://VOICE-SERVICE
          predicates:
            - Path=/api/voice/**

        - id: history-service
          uri: lb://HISTORY-SERVICE
          predicates:
            - Path=/api/history/**

        # ==========================
        # Swagger Routes
        # ==========================

        - id: auth-swagger
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/api-docs
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /${segment}

        - id: user-swagger
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/api-docs
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: voice-swagger
          uri: lb://VOICE-SERVICE
          predicates:
            - Path=/voice-service/api-docs
          filters:
            - RewritePath=/voice-service/(?<segment>.*), /${segment}

        - id: history-swagger
          uri: lb://HISTORY-SERVICE
          predicates:
            - Path=/history-service/api-docs
          filters:
            - RewritePath=/history-service/(?<segment>.*), /${segment}

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth-service/api-docs

      - name: User Service
        url: /user-service/api-docs

      - name: Voice Service
        url: /voice-service/api-docs

      - name: History Service
        url: /history-service/api-docs